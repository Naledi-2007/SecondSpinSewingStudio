
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Second Spin Sewing Studio</title>
    <meta name="description" content="Explore sewing, clothing repairs and sustainable fashion inspiration at Second Spin Sewing Studio.">

    <link rel="stylesheet" href="styles.css">

    <style>
        .gallery-section {
            max-width: 1150px;
            margin: 40px auto;
            padding: 20px;
        }

        .gallery-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .gallery-filters {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .gallery-filters button {
            padding: 10px 20px;
            border: 1px solid #777;
            border-radius: 20px;
            cursor: pointer;
            background: white;
        }

        .gallery-filters button.active,
        .gallery-filters button:hover {
            background: #333;
            color: white;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 22px;
        }

        .gallery-card {
            border-radius: 10px;
            overflow: hidden;
            background: #f5f5f5;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .gallery-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .gallery-card img:hover {
            transform: scale(1.04);
        }

        .gallery-card p {
            padding: 12px;
            text-align: center;
        }

        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 38px;
            cursor: pointer;
            background: none;
            border: none;
        }

        @media (max-width: 600px) {
            .gallery-section {
                padding: 12px;
            }

            .gallery-card img {
                height: 200px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Second Spin Sewing Studio</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="gallery.html">Gallery</a>
        <a href="enquiry.html">Enquiry</a>
        <a href="contact.html">Contact</a>
        <a href="mandela-day.html">Mandela Day</a>
    </nav>
</header>

<main class="gallery-section">

    <div class="gallery-heading">
        <h2>Our Inspiration Gallery</h2>
        <p>Discover creativity, clothing repairs and the beauty of sustainable fashion.</p>
    </div>

    <div class="gallery-filters">
        <button class="active" onclick="filterGallery('all', this)">All</button>
        <button onclick="filterGallery('repairs', this)">Repairs</button>
        <button onclick="filterGallery('upcycling', this)">Upcycling</button>
        <button onclick="filterGallery('sewing', this)">Sewing</button>
    </div>

    <div class="gallery-grid">

        <!-- Clothing Repairs -->
        <div class="gallery-card" data-category="repairs">
            <img
                src="https://image.uniqlo.com/UQ/ST3/ph/imagesother/Feature-Pages/ReUNIQLOSTUDIO/1015/1015/reduce-desktop.png"
                alt="Hands repairing a brown garment"
                onclick="openLightbox(this)">
            <p>Clothing Repairs</p>
        </div>

        <!-- Creative Sewing -->
        <div class="gallery-card" data-category="sewing">
            <img
                src="https://csm.tarnow.pl/uploads/site/event/img_094495fc17d2fd76104d835a43953dbd.jpeg"
                alt="Fabric being stitched on a sewing machine"
                onclick="openLightbox(this)">
            <p>Creative Sewing</p>
        </div>

        <!-- Upcycling Projects -->
        <div class="gallery-card" data-category="upcycling">
            <img
                src="https://cdn.stayhappening.com/events7/banners/d01dc94df1cc6ec6a8915def8425aacb1f38be489d89bf8e99b8911fe823f056-rimg-w1200-h829-dcd9dad4-gmir.jpg?v=1743134950"
                alt="Sewing machine and materials used for upcycling"
                onclick="openLightbox(this)">
            <p>Upcycling Projects</p>
        </div>

        <!-- Fabric Repairs -->
        <div class="gallery-card" data-category="repairs">
            <img
                src="https://images.squarespace-cdn.com/content/v1/5a555a504c0dbfb36fda563c/1528431279899-07X281DW0AKS6QT8IAV4/5_20_Jade%2B%282%29.jpg"
                alt="Fabric being repaired using an overlock sewing machine"
                onclick="openLightbox(this)">
            <p>Fabric Repairs</p>
        </div>

        <!-- Creative Designs -->
        <div class="gallery-card" data-category="sewing">
            <img
                src="https://www.glam.com/img/gallery/interested-in-upcycling-6-tools-youll-want-to-get-started/sewing-machine-1686255204.jpg"
                alt="Sewing creative clothing designs in a workshop"
                onclick="openLightbox(this)">
            <p>Creative Designs</p>
        </div>

    </div>
</main>

<!-- Image Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button
        class="lightbox-close"
        aria-label="Close image"
        onclick="closeLightbox()">&times;</button>

    <img id="lightboxImage" src="" alt="Enlarged gallery photograph">
</div>

<script>
    // Filter gallery images
    function filterGallery(category, button) {
        const cards = document.querySelectorAll(".gallery-card");

        cards.forEach(function(card) {
            card.style.display =
                (category === "all" || card.dataset.category === category)
                ? ""
                : "none";
        });

        document.querySelectorAll(".gallery-filters button").forEach(function(btn) {
            btn.classList.remove("active");
        });

        button.classList.add("active");
    }

    // Open enlarged image
    function openLightbox(image) {
        document.getElementById("lightboxImage").src = image.src;
        document.getElementById("lightbox").style.display = "flex";
    }

    // Close enlarged image
    function closeLightbox() {
        document.getElementById("lightbox").style.display = "none";
    }

    // Close lightbox using Escape key
    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeLightbox();
        }
    });
</script>

</body>
</html>
